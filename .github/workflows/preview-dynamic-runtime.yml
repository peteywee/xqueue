name: Preview Dynamic Runtime Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-dynamic-runtime.yml'
      - 'cloudflare/migrations/0008_dynamic_runtime_integrity.sql'
      - 'cloudflare/migrations/0009_deferred_lifecycle.sql'
      - 'cloudflare/migrations/0010_publication_fence_identity.sql'
      - 'cloudflare/migrations/0011_global_publication_halt.sql'
      - 'cloudflare/migrations/0012_reconciliation_determinations.sql'
      - '.github/workflows/preview-recovery-proof.yml'
      - '.github/workflows/preview-static-dynamic-parity.yml'
      - 'src/static-dynamic-parity.mjs'
      - 'scripts/preview-static-dynamic-parity.mjs'
      - 'test/static-dynamic-parity.test.mjs'
      - 'test/static-dynamic-parity-cli.test.mjs'
      - 'docs/recovery/static-dynamic-cutover-prep.md'
      - 'src/d1-publication-reconciliation.mjs'
      - 'src/d1-logical-backup.mjs'
      - 'scripts/d1-reconcile.mjs'
      - 'scripts/d1-logical-backup.mjs'
      - 'scripts/d1-backup-restore-proof.mjs'
      - 'test/d1-publication-reconciliation.test.mjs'
      - 'test/d1-logical-backup.test.mjs'
      - 'test/d1-recovery-cli.test.mjs'
      - 'cloudflare/src/dynamic-runtime-integrity.mjs'
      - 'src/d1-deferred-lifecycle.mjs'
      - 'cloudflare/src/media-verify.mjs'
      - 'cloudflare/src/worker.mjs'
      - 'src/continuous-queue-runtime-write.mjs'
      - 'src/continuous-queue-intake.mjs'
      - 'scripts/continuous-queue-intake.mjs'
      - 'scripts/preview-dynamic-runtime-proof.mjs'
      - 'test/dynamic-runtime-integrity.test.mjs'
      - 'test/deferred-lifecycle.test.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xqueue-preview-schema-mutation
  cancel-in-progress: false

jobs:
  prove-preview-dynamic-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CLOUDFLARE_ACCOUNT_ID: aab09adea145e6da8fa57b0f73b073da
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      XQUEUE_PREVIEW_DYNAMIC_RUNTIME_EVIDENCE: /tmp/xqueue-preview-dynamic-runtime-proof.json

    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prove dynamic runtime guards locally
        run: |
          node --test \
            test/dynamic-runtime-integrity.test.mjs \
            test/deferred-lifecycle.test.mjs \
            test/cloudflare-media.test.mjs \
            test/cloudflare-migration-lanes.test.mjs \
            test/d1-preview-shadow-proof.test.mjs \
            test/global-publication-halt.test.mjs \
            test/d1-publication-reconciliation.test.mjs \
            test/d1-logical-backup.test.mjs

      - name: Assert publication authority boundary remains intact
        run: pnpm audit:authority

      - name: Apply preview-only schema
        run: pnpm preview:intake:migrate

      - name: Initialize and prove preview dynamic runtime
        run: pnpm preview:runtime-proof

      - name: Upload dynamic runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: xqueue-preview-dynamic-runtime-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/xqueue-preview-dynamic-runtime-proof.json
          if-no-files-found: warn
