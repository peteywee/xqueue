name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies by design — nothing to install, nothing to audit.
      - name: Test
        run: npm test

      - name: Validate the content library
        run: npm run validate

      - name: Build the queue
        run: npm run build

      - name: Report
        run: npm run stats
