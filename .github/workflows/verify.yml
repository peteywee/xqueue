name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Assert generated queue is not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch queue.json >/dev/null 2>&1; then
            echo 'queue.json is generated and must not be tracked'
            exit 1
          fi

      - name: Verify
        run: pnpm verify

      - name: Assert the Cloudflare authority boundary is intact
        run: node scripts/authority-boundary-audit.mjs

      - name: Build legacy production compatibility bundle
        run: pnpm wrangler deploy --dry-run --outdir /tmp/xqueue-worker-bundle

      - name: Build target status-only Worker bundle
        run: pnpm wrangler deploy --config wrangler.status.jsonc --dry-run --outdir /tmp/xqueue-status-worker-bundle

      - name: Assert status bundle has no X publication capability
        shell: bash
        run: |
          if grep -R -E 'X_API_KEY|X_API_SECRET|X_ACCESS_TOKEN|X_ACCESS_SECRET|@xdevplatform|createPostViaClient|uploadMediaBytesViaClient' /tmp/xqueue-status-worker-bundle; then
            echo 'status-only Worker bundle contains X publication capability'
            exit 1
          fi

      - name: Build inert publisher Worker bundle
        run: pnpm wrangler deploy --config wrangler.publisher.jsonc --dry-run --outdir /tmp/xqueue-publisher-worker-bundle

      - name: Build future authority cutover publisher bundle
        run: pnpm wrangler deploy --config wrangler.authority.jsonc --dry-run --outdir /tmp/xqueue-authority-worker-bundle

      - name: Build inert XDK compatibility probe
        run: pnpm wrangler deploy --config wrangler.x-probe.jsonc --dry-run --outdir /tmp/xqueue-xdk-probe

      - name: Assert queue generation is portable
        shell: bash
        run: |
          if grep -q '"sourceFile": "/' queue.json; then
            echo 'queue.json contains an absolute sourceFile path'
            exit 1
          fi
