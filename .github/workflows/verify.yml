name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # No dependencies by design — this exists so the lockfile stays honest
      # and the pnpm guard is exercised in CI.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Validate the content library
        run: pnpm validate

      - name: Build the queue
        run: pnpm build

      - name: Report
        run: pnpm stats
