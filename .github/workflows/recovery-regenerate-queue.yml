name: Recovery queue regeneration

on:
  push:
    branches:
      - ops/recover-sept4-stale-backlog

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Regenerate deterministic production queue
        run: |
          node scripts/build-production-queue.mjs
          node scripts/build-cloudflare-queue-bundle.mjs

      - name: Focused recovery verification
        run: |
          node --check scripts/build-production-queue.mjs
          node --check scripts/build-cloudflare-queue-bundle.mjs
          node --test test/schedule.test.mjs test/runtime-health.test.mjs test/post-time.test.mjs test/hardening.test.mjs
          node scripts/xqueue-health.mjs

      - name: Guard generated scope
        run: |
          changed="$(git status --short --untracked-files=no)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^ M cloudflare/generated/queue-bundle\.mjs$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected tracked changes after regeneration:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit regenerated queue bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/generated/queue-bundle.mjs
          if git diff --cached --quiet; then
            echo 'Queue bundle already current.'
            exit 0
          fi
          git commit -m 'chore(recovery): regenerate queue bundle'
          git push
