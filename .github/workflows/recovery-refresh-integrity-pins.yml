name: Recovery integrity pin refresh

on:
  push:
    branches:
      - ops/recover-sept4-stale-backlog

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Refresh approved recovery invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          OLD = '09c36e24207d7720c46d163b83b9cee9465e6ded36221499032c0acee218bbc1'
          NEW = 'a8cda41f869f4e58d2566e5c558fbbd3f7ce89ae6cbf6d138b1e517f363750b7'
          TAIL = [
              ('B1', '2027-01-04', '14:30', '2027-01-04T20:30:00.000Z'),
              ('A30', '2027-01-04', '22:15', '2027-01-05T04:15:00.000Z'),
              ('C1', '2027-01-05', '14:30', '2027-01-05T20:30:00.000Z'),
              ('B30', '2027-01-05', '22:15', '2027-01-06T04:15:00.000Z'),
              ('D1', '2027-01-06', '14:30', '2027-01-06T20:30:00.000Z'),
              ('B14', '2027-01-06', '22:15', '2027-01-07T04:15:00.000Z'),
              ('A59', '2027-01-07', '14:30', '2027-01-07T20:30:00.000Z'),
          ]

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_exact(path, old, new, count=1):
              text = read(path)
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old[:80]}')
              write(path, text.replace(old, new, count))

          # Canonical queue integrity remains independently pinned.
          path = 'cloudflare/src/queue-integrity.mjs'
          text = read(path)
          if text.count(OLD) != 1:
              raise SystemExit('queue-integrity: old canonical SHA not unique')
          text = text.replace(OLD, NEW, 1)
          block = "export const EXPECTED_DEFERRED_TAIL = [\n" + ''.join(
              f"  {{\n    id: '{pid}',\n    scheduledDate: '{date}',\n    scheduledTime: '{clock}',\n    timezone: 'America/Chicago',\n  }},\n"
              for pid, date, clock, _ in TAIL
          ) + '];'
          text, n = re.subn(
              r"export const EXPECTED_DEFERRED_TAIL = \[.*?\n\];",
              block,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('queue-integrity: deferred-tail block not found exactly once')
          write(path, text)

          # Fixed SHA fixtures are explicit independent expectations.
          for path in [
              'test/cloudflare-runtime-readiness.test.mjs',
              'test/cloudflare-queue-bundle-adversarial.test.mjs',
              'test/cloudflare-eligibility-parity.test.mjs',
              'test/cloudflare-queue-bundle.test.mjs',
          ]:
              replace_exact(path, OLD, NEW)

          # Required parity scenarios: all seven deferred positions must exist.
          path = 'test/cloudflare-eligibility-parity.test.mjs'
          text = read(path)
          anchor = "    'deferred-tail-C1',\n"
          addition = (
              "    'deferred-tail-B30',\n"
              "    'deferred-tail-D1',\n"
              "    'deferred-tail-B14',\n"
              "    'deferred-tail-A59',\n"
          )
          if text.count(anchor) != 1 or addition in text:
              raise SystemExit('parity test: scenario anchor is not in expected baseline state')
          write(path, text.replace(anchor, anchor + addition, 1))

          # Adversarial selection tests protect every deferred row.
          path = 'test/cloudflare-eligibility-adversarial.test.mjs'
          text = read(path)
          tail_rows = ''.join(f"    ['{pid}', '{iso}'],\n" for pid, _, _, iso in TAIL)
          text, n = re.subn(
              r"  const tail = \[\n(?:    \['(?:B1|A30|C1)', '[^']+'\],\n){3}  \];",
              "  const tail = [\n" + tail_rows + "  ];",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('eligibility adversarial: old three-row tail not found')
          if text.count('queue.slice(-3)') != 1:
              raise SystemExit('eligibility adversarial: old tail slice not unique')
          text = text.replace('queue.slice(-3)', 'queue.slice(-7)', 1)
          old_set = "const deferred = new Set(['B1', 'A30', 'C1']);"
          new_set = "const deferred = new Set([\n    'B1',\n    'A30',\n    'C1',\n    'B30',\n    'D1',\n    'B14',\n    'A59',\n  ]);"
          if text.count(old_set) != 1:
              raise SystemExit('eligibility adversarial: old deferred set not unique')
          write(path, text.replace(old_set, new_set, 1))

          # Bundle tests pin the new generated metadata, bytes, exact tail, and attack result.
          path = 'test/cloudflare-queue-bundle.test.mjs'
          text = read(path)
          old_generated = "assert.deepEqual(GENERATED_FROM.deferToEnd, ['B1', 'A30', 'C1']);"
          new_generated = "assert.deepEqual(GENERATED_FROM.deferToEnd, [\n    'B1',\n    'A30',\n    'C1',\n    'B30',\n    'D1',\n    'B14',\n    'A59',\n  ]);"
          if text.count(old_generated) != 1:
              raise SystemExit('queue-bundle test: old GENERATED_FROM tail not unique')
          text = text.replace(old_generated, new_generated, 1)
          if text.count("Buffer.byteLength(live, 'utf8'), 160277") != 1:
              raise SystemExit('queue-bundle test: old canonical byte length not unique')
          text = text.replace("Buffer.byteLength(live, 'utf8'), 160277", "Buffer.byteLength(live, 'utf8'), 160385", 1)
          expected_rows = ''.join(
              f"    {{\n      id: '{pid}',\n      scheduledDate: '{date}',\n      scheduledTime: '{clock}',\n      timezone: 'America/Chicago',\n    }},\n"
              for pid, date, clock, _ in TAIL
          )
          replacement = (
              "test('deferred tail is exactly the seven policy-deferred posts with their exact schedules', async () => {\n"
              "  const expected = [\n" + expected_rows + "  ];\n\n"
              "  assert.deepEqual(EXPECTED_DEFERRED_TAIL, expected);\n"
              "  assert.deepEqual(DECLARED_DEFERRED_TAIL, expected);\n\n"
              "  const integrity = await computeBundleIntegrity();\n"
              "  assert.deepEqual(integrity.deferredTail, expected);\n"
              "  assert.equal(integrity.declaredMatches, true);\n\n"
              "  const queue = decodeBundledQueue();\n"
              "  for (const post of queue.slice(-7)) {\n"
              "    assert.equal(post.deferredToEnd, true);\n"
              "  }\n"
              "});\n"
          )
          text, n = re.subn(
              r"test\('deferred tail is exactly B1 / A30 / C1 with their exact schedules', async \(\) => \{.*?\n\}\);\n",
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('queue-bundle test: old exact-tail test not found')
          if text.count('assert.equal(verdict.deferredTail.length, 3);') != 1:
              raise SystemExit('queue-bundle test: old tail length assertion not unique')
          text = text.replace('assert.equal(verdict.deferredTail.length, 3);', 'assert.equal(verdict.deferredTail.length, 7);', 1)
          if text.count("assert.equal(verdict.deferredTail[0].id, 'C1');") != 1:
              raise SystemExit('queue-bundle test: reordered-tail assertion not unique')
          text = text.replace("assert.equal(verdict.deferredTail[0].id, 'C1');", "assert.equal(verdict.deferredTail[4].id, 'A59');", 1)
          write(path, text)

          # Keep the attack-model comment consistent with seven protected tail rows.
          replace_exact(
              'test/cloudflare-queue-bundle-adversarial.test.mjs',
              '// 177 of 180 posts rewritten. Count, unique IDs and the deferred tail are all',
              '// 173 of 180 posts rewritten. Count, unique IDs and the deferred tail are all',
          )

          # Generate seven real-queue parity cases instead of three.
          path = 'scripts/build-eligibility-parity-matrix.mjs'
          text = read(path)
          start_marker = '  // ---- real 180-post production queue, deferred tail ---------------------\n'
          end_marker = '  // ---- DST ---------------------------------------------------------------\n'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end <= start:
              raise SystemExit('parity builder: deferred section markers not found')
          section = start_marker
          for index, (pid, date, clock, iso) in enumerate(TAIL):
              outstanding = [row[0] for row in TAIL[index:]]
              posted_count = 180 - len(outstanding)
              js = '[' + ', '.join(f"'{item}'" for item in outstanding) + ']'
              section += (
                  "  add({\n"
                  f"    id: 'deferred-tail-{pid}',\n"
                  "    description:\n"
                  f"      'Real 180-post production queue with {posted_count} posts resolved before {pid}. {pid} {date} {clock} America/Chicago is exactly due.',\n"
                  "    queue: realQueue,\n"
                  f"    ledgerSetup: 'posted: {posted_count} posts before {pid}',\n"
                  f"    ledger: ledger({{ posted: postedAllExcept(realQueue, {js}) }}),\n"
                  f"    nowIso: '{iso}',\n"
                  "  });\n\n"
              )
          write(path, text[:start] + section + text[end:])
          PY

      - name: Regenerate parity evidence
        run: node scripts/build-eligibility-parity-matrix.mjs

      - name: Focused syntax and invariant tests
        run: |
          node --check cloudflare/src/queue-integrity.mjs
          node --check scripts/build-eligibility-parity-matrix.mjs
          node --check test/cloudflare-eligibility-adversarial.test.mjs
          node --check test/cloudflare-eligibility-parity.test.mjs
          node --check test/cloudflare-queue-bundle-adversarial.test.mjs
          node --check test/cloudflare-queue-bundle.test.mjs
          node --check test/cloudflare-runtime-readiness.test.mjs
          node --test test/cloudflare-eligibility-parity.test.mjs test/cloudflare-eligibility-adversarial.test.mjs test/cloudflare-queue-bundle.test.mjs

      - name: Commit approved recovery invariant refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/queue-integrity.mjs \
                  scripts/build-eligibility-parity-matrix.mjs \
                  test/cloudflare-eligibility-adversarial.test.mjs \
                  test/cloudflare-eligibility-parity.test.mjs \
                  test/cloudflare-queue-bundle-adversarial.test.mjs \
                  test/cloudflare-queue-bundle.test.mjs \
                  test/cloudflare-runtime-readiness.test.mjs \
                  docs/evidence/eligibility-parity-matrix.json
          git diff --cached --check
          git commit -m 'test(recovery): repin canonical queue invariants'
          git push
