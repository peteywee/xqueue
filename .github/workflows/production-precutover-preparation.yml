name: Production Pre-Cutover Preparation (Retired)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Historical workflow only; no production mutation will run'
        required: false
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse post-cutover preparation
        run: |
          echo "STOP: #46 canonical activation is complete."
          echo "This historical workflow cannot deploy or mutate production."
          echo "Use pnpm production:acceptance for publisher releases and the"
          echo "status-role reconciliation workflow for the status-only Worker."
          exit 1
