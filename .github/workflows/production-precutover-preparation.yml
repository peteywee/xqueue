name: Production Pre-Cutover Preparation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PREPARE_XQUEUE_PRODUCTION to run the non-authority production preparation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xqueue-production-precutover-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.confirm == 'PREPARE_XQUEUE_PRODUCTION' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      XQUEUE_PRODUCTION_PREP_APPROVED: PREPARE_XQUEUE_PRODUCTION
      XQUEUE_PRODUCTION_PREP_EVIDENCE: /tmp/xqueue-production-prep.json
      XQUEUE_CUTOVER_READINESS_EVIDENCE: /tmp/xqueue-production-cutover-readiness-after-prep.json

    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prove preparation boundary locally
        run: |
          node --test test/production-precutover-prep.test.mjs
          pnpm audit:authority
          pnpm audit:credentials

      - name: Deploy fail-closed UTC bundle with Cloudflare authority disabled
        run: pnpm wrangler deploy --config wrangler.prep.jsonc

      - name: Prove Cloudflare publication is inert before D1 mutation
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://xqueue-production.patrickcraven.workers.dev/health';
          const deadline = Date.now() + 120_000;
          let attempts = 0;
          let lastBody = null;
          let lastError = null;

          while (Date.now() < deadline) {
            attempts += 1;
            try {
              const response = await fetch(endpoint, {
                headers: {
                  accept: 'application/json',
                  'cache-control': 'no-cache',
                },
              });
              const body = await response.json();
              lastBody = body;
              lastError = null;

              const inert =
                body?.authorityReadiness?.authorityFlag === false &&
                body?.authorityReadiness?.authorized === false &&
                body?.livePublication === false &&
                body?.schedulerAuthority === false;

              if (inert) {
                console.log(
                  'PASS: Cloudflare publication authority is inert after ' +
                    attempts +
                    ' observation(s)',
                );
                process.exit(0);
              }
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }

            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }

          console.error(
            JSON.stringify(
              {
                error: 'authority_disable_propagation_timeout',
                attempts,
                lastError,
                lastBody,
              },
              null,
              2,
            ),
          );
          process.exit(1);
          NODE

      - name: Apply production continuous-queue and recovery schema
        run: pnpm wrangler d1 migrations apply xqueue-production --config wrangler.prep.jsonc --remote

      - name: Seed durable queue/runtime and activate committed UTC metadata
        run: node scripts/production-precutover-prepare.mjs

      - name: Normalize expired pre-cutover assignments to deferred
        run: node scripts/production-precutover-normalize.mjs

      - name: Prove UTC bundle and dynamic runtime are readable while authority stays disabled
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://xqueue-production.patrickcraven.workers.dev/health', {
            headers: { accept: 'application/json' },
          });
          const body = await response.json();
          const failures = [];
          if (body?.queueIntegrity?.ok !== true) failures.push('queue_integrity');
          if (body?.dynamicRuntimeReadiness?.ok !== true) failures.push('dynamic_runtime');
          if (body?.authorityReadiness?.ok !== true) failures.push('authority_readiness');
          if (body?.storage?.d1?.reachable !== true) failures.push('d1');
          if (body?.storage?.r2?.reachable !== true) failures.push('r2');
          if (body?.authorityReadiness?.authorityFlag !== false) failures.push('authority_flag');
          if (body?.authorityReadiness?.authorized !== false) failures.push('authorized');
          if (body?.livePublication !== false) failures.push('live_publication');
          if (body?.schedulerAuthority !== false) failures.push('scheduler_authority');
          if (failures.length) {
            console.error(JSON.stringify({ failures, body }, null, 2));
            process.exit(1);
          }
          console.log('PASS: production preparation is technically readable and non-authoritative');
          NODE

      - name: Observe remaining #46 blockers
        continue-on-error: true
        run: pnpm cutover:readiness

      - name: Upload production preparation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: xqueue-production-prep-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/xqueue-production-prep.json
            /tmp/xqueue-production-cutover-readiness-after-prep.json
          if-no-files-found: warn
