name: XQueue Integrity

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '17 6 * * *'
      timezone: 'America/Chicago'

permissions:
  contents: read

concurrency:
  group: xqueue-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Validate production schedule
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert generated queue is not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch queue.json >/dev/null 2>&1; then
            echo 'queue.json is generated and must not be tracked'
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Assert the Cloudflare authority boundary is intact
        run: node scripts/authority-boundary-audit.mjs

      - name: Validate content
        run: pnpm validate

      - name: Generate queue from production policy
        run: node scripts/xqueue-health.mjs --repair

      - name: Verify generated queue
        run: node scripts/xqueue-health.mjs

      - name: Prove deterministic regeneration
        shell: bash
        run: |
          cp queue.json /tmp/queue.first.json
          rm -f queue.json
          node scripts/xqueue-health.mjs --repair
          cmp /tmp/queue.first.json queue.json
          node scripts/xqueue-health.mjs

      - name: Assert generated queue is portable
        shell: bash
        run: |
          if grep -q '"sourceFile": "/' queue.json; then
            echo 'queue.json contains an absolute sourceFile path'
            exit 1
          fi
