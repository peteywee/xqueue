name: Production Mutation Schema

# Governed path for #145 stage B. Observe is read-only. Apply changes the
# production D1 schema (0015-0017 only), so it runs only on main, only when
# dispatched with the exact confirmation, and only after the script's gates,
# recovery checkpoint, and fresh re-read pass.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'observe (read-only) or apply'
        required: true
        default: observe
        type: choice
        options:
          - observe
          - apply
      confirm:
        description: 'Required for apply: xqueue-production-mutation-schema'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: xqueue-production-mutation
  cancel-in-progress: false

jobs:
  schema:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EVIDENCE_DIR: /tmp/xqueue-production-mutation-schema

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Require the dispatched commit to still be main
        env:
          DISPATCHED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$DISPATCHED_SHA"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prove the schema path and migration lanes locally
        run: |
          node --test \
            test/production-mutation-schema.test.mjs \
            test/cloudflare-migration-lanes.test.mjs \
            test/publication-mutation-mutex.test.mjs

      - name: Observe production mutation schema (read-only)
        if: inputs.mode == 'observe'
        run: pnpm production:mutation-schema --environment production --output "$EVIDENCE_DIR"

      - name: Apply production mutation schema
        if: inputs.mode == 'apply'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          pnpm production:mutation-schema --environment production \
            --apply --confirm "$CONFIRM" --output "$EVIDENCE_DIR"

      - name: Upload schema evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: xqueue-production-mutation-schema-${{ inputs.mode }}-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/xqueue-production-mutation-schema/production-mutation-schema-evidence.json
          if-no-files-found: warn
